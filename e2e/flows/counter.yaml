appId: host.exp.Exponent
---
# カウンター機能テスト

# Expo Go でプロジェクトを開く
- openLink: exp://localhost:8081

# アプリ読み込み待機
- extendedWaitUntil:
    visible: "Expo Template"
    timeout: 60000

# 開発者メニューが表示されていれば閉じる（条件付き実行）
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

# Resetボタンまでスクロール
- scrollUntilVisible:
    element:
      text: "Reset"
    direction: DOWN
    timeout: 60000

# Resetボタンが見えることを確認
- assertVisible: "Reset"

# Resetボタンをタップして初期状態にする
- tapOn: "Reset"

# +1ボタンをタップ
- tapOn: "+1"

# もう一度+1ボタンをタップ
- tapOn: "+1"

# -1ボタンをタップ
- tapOn: "-1"

# Resetボタンをタップ
- tapOn: "Reset"
